[package]
name = "devassist-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ureq = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-width = "0.2"

[features]
# The helpers other crates' tests use to reach into the core (`repos::state::testing`,
# `docker::state::testing`, `docker::model::samples`). Not part of a normal build.
testing = []

# `cargo test -p devassist-core` alone skips this test; `cargo test --workspace` runs it.
[[test]]
name = "headless_docker"
required-features = ["testing"]

[lints]
