[workspace]
members = [".", "crates/devassist-core"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
repository = "https://github.com/AsP3X/DevAssist"

[package]
name = "devassist"
version.workspace = true
edition = "2024"
description = "Terminal app that keeps your local GitHub clones in one overview and manages Docker containers, with keyboard or mouse"
license-file.workspace = true
repository.workspace = true
homepage = "https://github.com/AsP3X/DevAssist"
readme = "README.md"
keywords = ["git", "github", "tui", "repositories", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"
publish = false

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-width = "0.2"
ureq = "3.5"
devassist-core = { path = "crates/devassist-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
