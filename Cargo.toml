[workspace]
members = [".", "crates/devassist-core", "crates/devassist-glass", "crates/devassist-gui"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
repository = "https://github.com/AsP3X/DevAssist"

[workspace.dependencies]
devassist-core = { path = "crates/devassist-core" }
devassist-glass = { path = "crates/devassist-glass" }
# The window and UI, on the storytold egui fork (patched below), the same stack as Quill.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
serde_json = { version = "=1.0.154" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
png = "=0.18.1"
log = "=0.4.34"
# MUST stay the exact version eframe resolves to, or two wgpu copies would be built and their types differ.
wgpu = { version = "=30.0.2", default-features = false, features = ["glsl"] }

# The code-quality gate for the new crates only (they opt in with `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[package]
name = "devassist"
version.workspace = true
edition.workspace = true
description = "Terminal app that keeps your local GitHub clones in one overview and manages Docker containers, with keyboard or mouse"
license-file.workspace = true
repository.workspace = true
homepage = "https://github.com/AsP3X/DevAssist"
readme = "README.md"
keywords = ["git", "github", "tui", "repositories", "cli"]
categories = ["command-line-utilities", "development-tools"]
rust-version.workspace = true
publish = false

[dependencies]
ratatui = "0.30"
unicode-width = "0.2"
devassist-core.workspace = true

# Not inheriting the workspace lints on purpose (they are for the two new crates only).
[lints]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep the complete egui family and winit on the storytold fork commits Quill uses.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
